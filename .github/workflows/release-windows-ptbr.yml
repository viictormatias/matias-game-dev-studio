name: Build Windows installer (pt-BR)

# Windows-only release for this fork. Tags use the `ptbr-` prefix so the
# upstream multi-platform workflow (`v*` tags) is not triggered.
on:
  push:
    tags:
      - 'ptbr-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing ptbr- tag to build
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: npm ci

      - name: Build NSIS installer
        run: npm exec -- tauri build --ci --bundles nsis

      - name: Stage installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName "release-assets/Matias-Game-Dev-Studio-$env:RELEASE_TAG-windows-x64-setup.exe"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [windows]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-windows
          path: release-assets

      - name: Create release and upload installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --title "Matias Game Dev Studio ${RELEASE_TAG} (Windows, interface em português)" \
              --notes "Instalador para Windows x64 com a interface em português. Baixe o arquivo -setup.exe, instale e escolha a pasta do repositório clonado ao abrir o app." \
              --verify-tag
          fi
          gh release upload "${RELEASE_TAG}" release-assets/*.exe --clobber
